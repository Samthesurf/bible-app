appId: com.samuelsurf.bibleapp
productName: Bible App
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: bibles
    to: bibles
    filter:
      - "**/*.json"
  - from: electron/kokoro_service.py
    to: electron/kokoro_service.py
linux:
  artifactName: ${productName}.${ext}
  target:
    - AppImage
  category: Education
  icon: build/icon.png
  # Name the .desktop entry after package.json#desktopName so its
  # StartupWMClass matches the app_id Electron sets on Wayland.
  syncDesktopName: true
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
npmRebuild: false
